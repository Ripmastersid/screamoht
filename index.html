<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ohrbit Studio Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/gifler@0.1.0/gifler.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: #0a0e27; 
            color: #fff; 
            overflow: hidden; 
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
        }
        .hidden { display: none !important; }

        header { 
            background: #16213e; 
            padding: 10px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #e94560; 
            flex-shrink: 0;
        }
        .logo { font-size: 16px; font-weight: bold; color: #e94560; display: flex; align-items: center; gap: 8px; }
        .status { font-size: 11px; padding: 4px 10px; background: rgba(0,0,0,0.4); border-radius: 12px; display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
        .status-dot.live { background: #e94560; box-shadow: 0 0 8px #e94560; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .preview-area { 
            flex: 1; 
            position: relative; 
            background: #000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            touch-action: none;
        }
        #mainCanvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            background: #111; 
            transition: transform 0.3s ease;
        }
        #hiddenVideo { display: none; }
        .placeholder { position: absolute; color: #888; text-align: center; padding: 20px; font-size: 14px; pointer-events: none; }

        .controls-bar { 
            background: #16213e; 
            padding: 10px; 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            border-top: 1px solid #0f3460; 
            flex-shrink: 0;
        }
        .btn { 
            padding: 10px 14px; 
            border: none; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            white-space: nowrap; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: #e94560; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-danger { background: #dc3545; color: white; }

        .settings-panel { 
            background: #0f3460; 
            padding: 15px; 
            max-height: 45vh; 
            overflow-y: auto; 
            display: none; 
            border-top: 1px solid #16213e;
            flex-shrink: 0;
        }
        .settings-panel.open { display: block; }
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 11px; color: #aaa; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-input { 
            width: 100%; 
            padding: 10px; 
            background: rgba(0,0,0,0.3); 
            border: 1px solid #16213e; 
            border-radius: 4px; 
            color: white; 
            font-size: 13px; 
        }
        .form-input:focus { outline: none; border-color: #e94560; }
        
        .overlay-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .overlay-list-item { 
            background: rgba(0,0,0,0.3); 
            padding: 8px 10px; 
            border-radius: 4px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 12px; 
        }
        .btn-sm { padding: 4px 8px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-del { background: #dc3545; color: white; }
        input[type="file"] { display: none; }

        .hint { 
            position: absolute; 
            bottom: 10px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.7); 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            color: #aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🎬 Ohrbit Studio</div>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Pronto</span>
        </div>
    </header>

    <div class="preview-area" id="previewArea">
        <video id="hiddenVideo" autoplay playsinline muted></video>
        <canvas id="mainCanvas"></canvas>
        <div class="placeholder" id="placeholder">Toque em "Capturar Tela" ou adicione um Overlay</div>
        <div class="hint" id="hint">💡 1 dedo: arrastar | 2 dedos: redimensionar</div>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="form-group">
            <label class="form-label">URL do Servidor (Restream)</label>
            <input type="text" class="form-input" id="rtmpUrl" placeholder="rtmp://..." >
        </div>
        <div class="form-group">
            <label class="form-label">Chave de Transmissão</label>
            <input type="password" class="form-input" id="streamKey" placeholder="Sua chave">
        </div>
        <div class="form-group">
            <label class="form-label">Adicionar Overlay (PNG/GIF)</label>
            <label class="btn btn-secondary" style="justify-content: center; width: 100%;">
                📁 Escolher Imagem
                <input type="file" id="overlayInput" accept="image/*">
            </label>
        </div>
        <div class="overlay-list" id="overlayList"></div>
    </div>

    <div class="controls-bar">
        <button class="btn btn-secondary" id="toggleSettings">⚙️ Config</button>
        <button class="btn btn-primary" id="captureBtn">📺 Capturar Tela</button>
        <button class="btn btn-secondary hidden" id="rotateBtn">🔄 Girar</button>
        <button class="btn btn-danger hidden" id="stopBtn">⏹️ Parar</button>
        <button class="btn btn-primary hidden" id="liveBtn">🔴 AO VIVO</button>
    </div>

    <script>
        // ==========================================
        // 1. ESTADO DA APLICAÇÃO
        // ==========================================
        const state = {
            isCapturing: false,
            rotation: 0, 
            overlays: [],
            stream: null,
            isDragging: false,
            dragTarget: null,
            dragOffset: { x: 0, y: 0 },
            isPinching: false,
            pinchStartDistance: 0,
            pinchTarget: null,
            pinchStartScale: 1
        };

        // ==========================================
        // 2. REFERÊNCIAS DOM
        // ==========================================
        const video = document.getElementById('hiddenVideo');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('placeholder');
        const previewArea = document.getElementById('previewArea');
        const hint = document.getElementById('hint');

        // ==========================================
        // 3. INICIALIZAÇÃO
        // ==========================================
        canvas.width = 1280;
        canvas.height = 720;

        document.getElementById('rtmpUrl').value = localStorage.getItem('rtmpUrl') || '';
        document.getElementById('streamKey').value = localStorage.getItem('streamKey') || '';

        document.getElementById('rtmpUrl').addEventListener('input', (e) => localStorage.setItem('rtmpUrl', e.target.value));
        document.getElementById('streamKey').addEventListener('input', (e) => localStorage.setItem('streamKey', e.target.value));

        document.getElementById('toggleSettings').addEventListener('click', () => {
            document.getElementById('settingsPanel').classList.toggle('open');
        });

        // Esconder hint após 5 segundos
        setTimeout(() => { hint.style.opacity = '0'; hint.style.transition = 'opacity 1s'; }, 5000);

        // ==========================================
        // 4. ENGINE DE COMPOSIÇÃO (CANVAS LOOP)
        // ==========================================
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (state.isCapturing && video.readyState >= 2) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#0a0e27";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Grid sutil
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                ctx.lineWidth = 1;
                for(let i=0; i<canvas.width; i+=100) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
                for(let i=0; i<canvas.height; i+=100) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }
            }

            // Desenha overlays
            state.overlays.forEach(ov => {
                if (ov.isGif && ov.currentFrame) {
                    ctx.drawImage(ov.currentFrame, ov.x, ov.y, ov.width, ov.height);
                } else if (ov.imgElement) {
                    ctx.drawImage(ov.imgElement, ov.x, ov.y, ov.width, ov.height);
                }
            });

            requestAnimationFrame(drawCanvas);
        }
        
        requestAnimationFrame(drawCanvas);

        // ==========================================
        // 5. GERENCIAMENTO DE MÍDIA
        // ==========================================
        document.getElementById('captureBtn').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { displaySurface: "browser", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: true 
                });
                
                state.stream = stream;
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    state.isCapturing = true;
                    placeholder.classList.add('hidden');
                    updateButtons();
                };

                stream.getVideoTracks()[0].onended = stopCapture;
            } catch (err) {
                console.error("Erro na captura:", err);
                alert('Captura cancelada ou não suportada.');
            }
        });

        function stopCapture() {
            if (state.stream) {
                state.stream.getTracks().forEach(t => t.stop());
                state.stream = null;
            }
            state.isCapturing = false;
            video.srcObject = null;
            
            if (state.overlays.length === 0) {
                placeholder.classList.remove('hidden');
            }
            updateButtons();
        }

        function updateButtons() {
            const isOn = state.isCapturing;
            document.getElementById('captureBtn').classList.toggle('hidden', isOn);
            document.getElementById('rotateBtn').classList.toggle('hidden', !isOn);
            document.getElementById('stopBtn').classList.toggle('hidden', !isOn);
            document.getElementById('liveBtn').classList.toggle('hidden', !isOn);
        }

        document.getElementById('stopBtn').addEventListener('click', stopCapture);

        document.getElementById('rotateBtn').addEventListener('click', () => {
            state.rotation = (state.rotation + 90) % 360;
            canvas.style.transform = `rotate(${state.rotation}deg)`;
        });

        // ==========================================
        // 6. GERENCIAMENTO DE OVERLAYS (COM GIF ANIMADO)
        // ==========================================
        document.getElementById('overlayInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const isGif = file.type === 'image/gif';
            const img = new Image();
            
            img.onload = () => {
                const id = Date.now();
                const maxWidth = canvas.width * 0.3;
                const scale = maxWidth / img.width;
                
                const overlay = {
                    id,
                    imgElement: img,
                    isGif: isGif,
                    currentFrame: img,
                    name: file.name,
                    x: (canvas.width - (img.width * scale)) / 2,
                    y: (canvas.height - (img.height * scale)) / 2,
                    width: img.width * scale,
                    height: img.height * scale,
                    originalWidth: img.width * scale,
                    originalHeight: img.height * scale
                };

                if (isGif) {
                    // Carrega GIF animado com gifler
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        gifler(event.target.result).frames(canvas, (ctx, frame) => {
                            // Atualiza o frame atual do overlay
                            overlay.currentFrame = frame.buffer;
                            overlay.gifWidth = frame.width;
                            overlay.gifHeight = frame.height;
                        });
                    };
                    reader.readAsArrayBuffer(file);
                }
                
                state.overlays.push(overlay);
                updateOverlayListUI();
            };
            
            img.src = URL.createObjectURL(file);
            e.target.value = '';
        });

        function updateOverlayListUI() {
            const list = document.getElementById('overlayList');
            list.innerHTML = '';
            state.overlays.forEach(ov => {
                const div = document.createElement('div');
                div.className = 'overlay-list-item';
                div.innerHTML = `
                    <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 70%;">🖼️ ${ov.name}</span>
                    <button class="btn-sm btn-del" onclick="removeOverlay(${ov.id})">X</button>
                `;
                list.appendChild(div);
            });
        }

        window.removeOverlay = (id) => {
            state.overlays = state.overlays.filter(o => o.id !== id);
            updateOverlayListUI();
        };

        // ==========================================
        // 7. INTERAÇÃO TOUCH (DRAG + PINCH ZOOM)
        // ==========================================
        previewArea.addEventListener('touchstart', handleTouchStart, { passive: false });
        previewArea.addEventListener('touchmove', handleTouchMove, { passive: false });
        previewArea.addEventListener('touchend', handleTouchEnd);

        function getCanvasCoordinates(touch) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (touch.clientX - rect.left) * scaleX,
                y: (touch.clientY - rect.top) * scaleY
            };
        }

        function getDistance(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function handleTouchStart(e) {
            if (state.overlays.length === 0) return;
            e.preventDefault();
            
            const touches = e.touches;
            
            if (touches.length === 2) {
                // PINCH ZOOM - detectar qual overlay está sendo tocado
                const pos1 = getCanvasCoordinates(touches[0]);
                const pos2 = getCanvasCoordinates(touches[1]);
                const center = { x: (pos1.x + pos2.x) / 2, y: (pos1.y + pos2.y) / 2 };
                
                // Encontra overlay sob o centro do pinch
                for (let i = state.overlays.length - 1; i >= 0; i--) {
                    const ov = state.overlays[i];
                    if (center.x >= ov.x && center.x <= ov.x + ov.width && center.y >= ov.y && center.y <= ov.y + ov.height) {
                        state.isPinching = true;
                        state.pinchTarget = ov;
                        state.pinchStartDistance = getDistance(touches[0], touches[1]);
                        state.pinchStartScale = ov.width / ov.originalWidth;
                        return;
                    }
                }
            } else if (touches.length === 1) {
                // DRAG - um dedo
                const pos = getCanvasCoordinates(touches[0]);
                
                for (let i = state.overlays.length - 1; i >= 0; i--) {
                    const ov = state.overlays[i];
                    if (pos.x >= ov.x && pos.x <= ov.x + ov.width && pos.y >= ov.y && pos.y <= ov.y + ov.height) {
                        state.isDragging = true;
                        state.dragTarget = ov;
                        state.dragOffset = { x: pos.x - ov.x, y: pos.y - ov.y };
                        return;
                    }
                }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touches = e.touches;
            
            if (state.isPinching && state.pinchTarget && touches.length === 2) {
                // Calcula nova escala baseada na distância dos dedos
                const currentDistance = getDistance(touches[0], touches[1]);
                const scale = (currentDistance / state.pinchStartDistance) * state.pinchStartScale;
                
                // Limita escala entre 0.3x e 3x
                const clampedScale = Math.max(0.3, Math.min(3, scale));
                
                // Mantém o centro do overlay no mesmo lugar
                const centerX = state.pinchTarget.x + state.pinchTarget.width / 2;
                const centerY = state.pinchTarget.y + state.pinchTarget.height / 2;
                
                state.pinchTarget.width = state.pinchTarget.originalWidth * clampedScale;
                state.pinchTarget.height = state.pinchTarget.originalHeight * clampedScale;
                state.pinchTarget.x = centerX - state.pinchTarget.width / 2;
                state.pinchTarget.y = centerY - state.pinchTarget.height / 2;
                
            } else if (state.isDragging && state.dragTarget && touches.length === 1) {
                const pos = getCanvasCoordinates(touches[0]);
                state.dragTarget.x = pos.x - state.dragOffset.x;
                state.dragTarget.y = pos.y - state.dragOffset.y;
            }
        }

        function handleTouchEnd(e) {
            if (e.touches.length === 0) {
                state.isDragging = false;
                state.dragTarget = null;
                state.isPinching = false;
                state.pinchTarget = null;
            }
        }

        // ==========================================
        // 8. AÇÃO AO VIVO (SIMULAÇÃO)
        // ==========================================
        document.getElementById('liveBtn').addEventListener('click', () => {
            const url = document.getElementById('rtmpUrl').value;
            const key = document.getElementById('streamKey').value;
            if (!url || !key) {
                alert('Configure URL e Chave nas Configurações.');
                return;
            }
            document.getElementById('statusDot').classList.add('live');
            document.getElementById('statusText').textContent = 'AO VIVO (Local)';
            alert('Cena composta com sucesso!\n\nPróximo passo: Conectar ao Render/Restream.');
        });
    </script>
</body>
</html>
